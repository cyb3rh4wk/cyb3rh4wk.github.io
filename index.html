  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body {
      background: #282a36;
      font-family: 'Fira Code', monospace;
      color: #f8f8f2;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    /* Cosmos background */
    #cosmos-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; overflow: hidden;
      background: radial-gradient(ellipse at 20% 50%, #1a1033 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 20%, #0d1b2a 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, #1b0a2e 0%, transparent 50%),
                  #0c0c1a;
    }
    #cosmos-bg canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    #cosmos-bg .nebula {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at 30% 40%, rgba(189,147,249,0.06) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 60%, rgba(139,233,253,0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 30%, rgba(255,121,198,0.04) 0%, transparent 55%);
      filter: blur(40px);
      animation: nebulaShift 30s ease-in-out infinite alternate;
    }
    @keyframes nebulaShift {
      0% { transform: scale(1) translate(0, 0); opacity: 0.8; }
      50% { transform: scale(1.05) translate(10px, -10px); opacity: 1; }
      100% { transform: scale(1) translate(-10px, 10px); opacity: 0.8; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #21222c; }
    ::-webkit-scrollbar-thumb { background: #44475a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6272a4; }

    /* Boot line animation */
    .boot-line-enter {
      animation: bootLineIn 0.1s ease-out;
    }
    @keyframes bootLineIn {
      from { opacity: 0; transform: translateX(-4px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* CRT flicker */
    @keyframes crtFlicker {
      0% { opacity: 0.02; }
      5% { opacity: 0.04; }
      10% { opacity: 0.01; }
      15% { opacity: 0.03; }
      20% { opacity: 0.02; }
      100% { opacity: 0.02; }
    }

    /* Content fade in */
    .content-fade-in {
      animation: contentIn 0.3s ease-out;
    }
    @keyframes contentIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glitch effect */
    .glitch-active {
      animation: glitch 0.2s linear;
    }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
      40% { transform: translate(2px, -1px); filter: hue-rotate(180deg); }
      60% { transform: translate(-1px, -1px); filter: hue-rotate(270deg); }
      80% { transform: translate(1px, 2px); }
      100% { transform: translate(0); }
    }

    /* Scanline overlay - very subtle */
    .scanlines {
      opacity: 0.15 !important;
    }

    /* Selection */
    ::selection {
      background: #44475a;
      color: #ff79c6;
    }

    /* Fade from boot to terminal */
    .terminal-enter {
      animation: terminalFadeIn 0.6s ease-out;
    }
    @keyframes terminalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 700px) {
      .sidebar-desktop { display: none !important; }
    }

    /* Blinking block cursor like Warp terminal */
    input {
      caret-color: transparent !important;
    }
    .cmd-input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
    }
    .cmd-cursor {
      display: inline-block;
      width: 9px;
      height: 17px;
      background: #50fa7b;
      animation: blockBlink 1s step-end infinite;
      vertical-align: text-bottom;
      margin-left: -1px;
      position: absolute;
      pointer-events: none;
    }
    @keyframes blockBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    input::placeholder {
      color: #6272a4;
      opacity: 0.6;
    }

    /* Skill bar animation */
    .role-block:hover {
      background: rgba(68,71,90,0.4) !important;
    }

    /* Hamburger only on mobile */
    .mobile-only { display: none !important; }

    /* Mobile responsive */
    @media (max-width: 768px) {
      body { font-size: 13px; }

      /* Boot sequence fits narrow screens */
      .boot-container { padding: 14px 10px !important; }
      .boot-line { font-size: 10px !important; line-height: 1.5 !important; }
      .boot-skip { bottom: 10px !important; right: 10px !important; font-size: 11px !important; padding: 3px 8px !important; }

      /* Hide glitch title; show hamburger */
      .topbar-title { display: none !important; }
      .mobile-only { display: flex !important; }

      /* Drawer sidebar */
      .sidebar-drawer {
        position: fixed !important;
        top: 29px !important; left: 0 !important; bottom: 0 !important;
        z-index: 60 !important;
        max-width: 300px;
        box-shadow: 4px 0 16px rgba(0,0,0,0.6);
      }
      .sidebar-hidden { display: none !important; }
      .sidebar-backdrop {
        position: fixed;
        top: 29px; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.55);
        z-index: 55;
      }

      /* Status bar compact */
      .statusbar-mid { display: none !important; }

      /* Content padding smaller */
      .content-area { padding: 12px 14px !important; }

      /* Skill bars compact */
      .skill-bar { font-size: 11px !important; gap: 6px !important; }
      .skill-bar-name { min-width: 130px !important; }

      /* Project header wraps */
      .project-header { flex-wrap: wrap !important; row-gap: 4px !important; }
      .project-period { margin-right: 0 !important; }

      /* Role/section text compact */
      .role-title { font-size: 13px !important; }
      .role-meta { font-size: 12px !important; }
      .role-highlight { font-size: 12px !important; line-height: 1.55 !important; }
      .section-heading { font-size: 15px !important; }

      /* Command bar compact */
      .command-bar { font-size: 13px !important; padding: 6px 10px !important; }
      .command-bar input { font-size: 13px !important; }
      .cmd-cursor { width: 8px !important; height: 15px !important; }

      /* Softer scanlines on small screens */
      .scanlines { opacity: 0.08 !important; }
    }
  </style>

    // Star field
    (function() {
      const canvas = document.getElementById('star-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = [];
        for (let i = 0; i < 200; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.5 + 0.3,
            a: Math.random(),
            speed: Math.random() * 0.005 + 0.002,
            phase: Math.random() * Math.PI * 2,
          });
        }
      }
      function draw(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          const twinkle = 0.4 + 0.6 * Math.sin(t * s.speed + s.phase);
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(248, 248, 242, ${s.a * twinkle})`;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      resize();
      window.addEventListener('resize', resize);
      requestAnimationFrame(draw);
    })();
  </script>

    function useTypingEffect(text, speed = 30, startDelay = 0, enabled = true) {
      const [displayed, setDisplayed] = React.useState('');
      const [done, setDone] = React.useState(false);

      React.useEffect(() => {
        if (!enabled) { setDisplayed(''); setDone(false); return; }
        let i = 0;
        setDisplayed('');
        setDone(false);
        const startTimeout = setTimeout(() => {
          const interval = setInterval(() => {
            i++;
            setDisplayed(text.slice(0, i));
            if (i >= text.length) { clearInterval(interval); setDone(true); }
          }, speed);
          return () => clearInterval(interval);
        }, startDelay);
        return () => clearTimeout(startTimeout);
      }, [text, speed, startDelay, enabled]);

      return { displayed, done };
    }

    function Cursor({ color = DRACULA.green }) {
      const [visible, setVisible] = React.useState(true);
      React.useEffect(() => {
        const i = setInterval(() => setVisible(v => !v), 530);
        return () => clearInterval(i);
      }, []);
      return React.createElement('span', {
        style: { color, opacity: visible ? 1 : 0, fontWeight: 'bold' }
      }, '█');
    }

      const [booted, setBooted] = React.useState(false);
      const [skipBoot] = React.useState(() => {
        return sessionStorage.getItem('sai-portfolio-booted') === 'true';
      });

      const handleBootComplete = () => {
        sessionStorage.setItem('sai-portfolio-booted', 'true');
        setBooted(true);
      };

      React.useEffect(() => {
        const handler = (e) => {
          if (e.key === 'Escape' && !booted) handleBootComplete();
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [booted]);

      if (skipBoot || booted) {
        return React.createElement('div', { className: 'terminal-enter' },
          React.createElement(Terminal)
        );
      }

      return React.createElement(BootSequence, { onComplete: handleBootComplete });
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
